<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางยืม-คืนอุปกรณ์</title>
  
  <!-- CDN ตกแต่งหน้าตา (Tailwind + FontAwesome + Kanit Font) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    * { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-[#f0f4f8] p-6 text-slate-700">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header สวยงาม + ปุ่ม Logout -->
    <header class="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl">📦</span>
        <div>
          <h1 class="text-xl font-bold text-blue-600">ระบบยืม-คืนอุปกรณ์</h1>
          <p class="text-xs text-slate-400">Database Project</p>
        </div>
      </div>
      <nav class="flex items-center gap-2 text-sm font-medium">
        <a href="index.html" class="px-3 py-2 hover:bg-slate-100 rounded-lg">ค้นหา</a>
        <a href="borrow-table.html" class="px-3 py-2 bg-blue-50 text-blue-600 rounded-lg">ตารางยืม-คืน</a>
        <a href="dashboard.html" class="px-3 py-2 hover:bg-slate-100 rounded-lg">คลังอุปกรณ์</a>
        <a href="status.html" class="px-3 py-2 hover:bg-slate-100 rounded-lg">สถานะ/Blacklist</a>
        <a href="history.html" class="px-3 py-2 hover:bg-slate-100 rounded-lg">ประวัติรายวัน</a>
        
        <button onclick="logout()" class="ml-2 px-3 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
        </button>
      </nav>
    </header>

    <!-- Content ตารางยืม-คืน -->
    <main class="bg-white p-6 rounded-2xl shadow-sm border">
      <h2 class="font-bold text-slate-800 mb-4">รายการยืมปัจจุบัน</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left border">
          <thead class="bg-slate-100 border-b text-slate-700">
            <tr>
              <th class="p-2 border text-center">ลำดับที่</th>
              <th class="p-2 border">เลขบัตรปชช</th>
              <th class="p-2 border">เลขบัตรนิสิต</th>
              <th class="p-2 border">ชื่อจริง</th>
              <th class="p-2 border">สิ่งของ</th>
              <th class="p-2 border text-center">จำนวน</th>
              <th class="p-2 border">เวลาที่ยืม</th>
              <th class="p-2 border text-center">จัดการ (3 ปุ่ม)</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>

  </div>

  <script>
    // 1. ระบบเช็คการล็อกอิน ( Auth Guard )
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      alert('กรุณาเข้าสู่ระบบก่อนใช้งาน');
      window.location.href = 'login.html';
    }

    // 2. ฟังก์ชันออกจากระบบ
    function logout() {
      if (confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('adminUser');
        window.location.href = 'login.html';
      }
    }

    // 3. โหลดข้อมูลตาราง (DB หรือระบบเดิม)
    let dataRemote = false;
    let borrowBusy = false;

    async function loadData() {
      const bundle = await getBorrowBundle();
      dataRemote = bundle.remote;
      const { items } = bundle;

      const students = await fetchStudents();

      const active = (bundle.borrows || []).filter(b => b.status === 'กำลังยืม' || b.status === 'เกินกำหนด');
      const itemMap = {}, stuMap = {};
      (items || []).forEach(i => itemMap[i.item_id] = i);
      students.forEach(s => stuMap[s.student_id] = s);

      const tbody = document.getElementById('table-body');
      const rows = active.map(b => {
        const lines = (bundle.borrowitems || []).filter(x => x.borrow_id === b.borrow_id);
        const stu = stuMap[b.student_id];
        return {
          ...b,
          citizen: (stu && stu.citizen_id) || b.citizen_id || '-',
          itemNames: lines.map(x => itemMap[x.item_id] ? itemMap[x.item_id].itemname : (x.itemname || 'อุปกรณ์ #' + x.item_id)).join(', ') || '-',
          totalQty: lines.reduce((s, x) => s + Number(x.quantity || 0), 0)
        };
      });

      tbody.innerHTML = rows.map((b, index) => `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-2 border text-center">${index + 1}</td>
          <td class="p-2 border font-mono">${b.citizen}</td>
          <td class="p-2 border font-mono">${b.student_id}</td>
          <td class="p-2 border font-bold text-slate-800">${b.borrowname}</td>
          <td class="p-2 border">${b.itemNames}</td>
          <td class="p-2 border text-center font-semibold">${b.totalQty}</td>
          <td class="p-2 border font-mono text-slate-500">${fmtDT(b.borrowdatetime)}</td>
          <td class="p-2 border text-center">
            <div class="flex justify-center items-center gap-1.5">
              <button onclick="completeBorrow(${b.borrow_id}, this)" class="bg-emerald-500 hover:bg-emerald-600 text-white w-8 h-8 rounded-lg flex items-center justify-center shadow-sm transition" title="เสร็จสิ้น">
                <i class="fa-solid fa-check"></i>
              </button>
              <button onclick="setBlacklist(${b.borrow_id})" class="bg-amber-500 hover:bg-amber-600 text-white px-2.5 h-8 rounded-lg flex items-center justify-center gap-1 text-xs font-bold shadow-sm transition" title="Blacklist">
                <i class="fa-solid fa-triangle-exclamation"></i> Blacklist
              </button>
              <button onclick="cancelBorrow(${b.borrow_id})" class="bg-rose-500 hover:bg-rose-600 text-white w-8 h-8 rounded-lg flex items-center justify-center shadow-sm transition" title="ยกเลิก">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="8" class="p-6 text-center text-slate-400">ไม่มีรายการยืม</td></tr>';
    }

    // คืนของ (ล็อกปุ่มไม่ให้กดซ้ำระหว่างประมวลผล)
    async function completeBorrow(id, btn) {
      if (borrowBusy) return;
      borrowBusy = true;
      if (btn) { btn.disabled = true; btn.classList.add('opacity-50', 'cursor-not-allowed'); }

      try {
        if (!dataRemote) {
          const arr = localBorrows();
          const b = arr.find(x => x.id === id);
          if (b) {
            const now = new Date();
            b.status = 'คืนแล้ว';
            b.returnTime = `${now.getHours()}.${now.getMinutes().toString().padStart(2, '0')}`;
            saveLocalBorrows(arr);
          }
          loadData();
          return;
        }

        const { data: lines } = await sb.from('borrowitem').select('*').eq('borrow_id', id);

        await sb.from('borrow').update({ status: 'คืนแล้ว' }).eq('borrow_id', id);
        await sb.from('borrowitem').update({ status: 'คืนแล้ว' }).eq('borrow_id', id);

        const stamp = nowISO();

        for (const line of (lines || [])) {
          // บันทึกเวลาคืนจริงลงตาราง return (ใช้คอลัมน์ duetime)
          await sb.from('return').insert([{
            borrowitem_id: line.borrowitem_id,
            duetime: stamp
          }]);

          const { data: item } = await sb.from('item').select('*').eq('item_id', line.item_id).single();
          if (item) {
            await sb.from('item').update({ availablequantity: item.availablequantity + Number(line.quantity || 0) }).eq('item_id', line.item_id);
          }
        }
        loadData();
      } finally {
        borrowBusy = false;
        if (btn) { btn.disabled = false; btn.classList.remove('opacity-50', 'cursor-not-allowed'); }
      }
    }

    // ติด Blacklist
    async function setBlacklist(id) {
      if (!dataRemote) {
        if (!confirm('ย้ายรายชื่อนี้ไปที่ Blacklist ใช่หรือไม่?')) return;
        const arr = localBorrows();
        const b = arr.find(x => x.id === id);
        if (b) { b.status = 'Blacklist'; saveLocalBorrows(arr); }
        loadData();
        return;
      }

      const reason = prompt('เหตุผลที่ติด Blacklist:', 'ไม่นำอุปกรณ์มาคืนตามกำหนดเวลา');
      if (reason === null) return;
      if (borrowBusy) return;
      borrowBusy = true;

      try {
        const { data: lines } = await sb.from('borrowitem').select('*').eq('borrow_id', id);

        await sb.from('borrow').update({ status: 'Blacklist' }).eq('borrow_id', id);
        await sb.from('borrowitem').update({ status: 'Blacklist' }).eq('borrow_id', id);

        // สร้าง return เพียง 1 แถวต่อ 1 ใบยืม เพื่อผูก blacklist (แสดง 1 รายการต่อใบยืม)
        let returnId = null;
        const firstLine = (lines && lines.length) ? lines[0] : null;
        if (firstLine) {
          const { data: ret } = await sb.from('return').insert([{ borrowitem_id: firstLine.borrowitem_id, duetime: nowISO() }]).select().single();
          if (ret) returnId = ret.return_id;
        }

        await sb.from('blacklist').insert([{ return_id: returnId, reason, status: 'ติด Blacklist' }]);
        loadData();
      } finally {
        borrowBusy = false;
      }
    }

    // ยกเลิกรายการ
    async function cancelBorrow(id) {
      if (!dataRemote) {
        if (!confirm('ต้องการยกเลิกรายการนี้หรือไม่?')) return;
        saveLocalBorrows(localBorrows().filter(x => x.id !== id));
        loadData();
        return;
      }

      if (!confirm('ต้องการยกเลิกรายการนี้หรือไม่?')) return;

      const { data: lines } = await sb.from('borrowitem').select('*').eq('borrow_id', id);

      for (const line of (lines || [])) {
        const { data: item } = await sb.from('item').select('*').eq('item_id', line.item_id).single();
        if (item) {
          await sb.from('item').update({ availablequantity: item.availablequantity + Number(line.quantity || 0) }).eq('item_id', line.item_id);
        }
      }

      await sb.from('borrowitem').delete().eq('borrow_id', id);
      await sb.from('borrow').delete().eq('borrow_id', id);
      loadData();
    }

    loadData();
  </script>
</body>
</html>
