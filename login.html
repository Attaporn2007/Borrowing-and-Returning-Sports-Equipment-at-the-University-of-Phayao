<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบยืม-คืนอุปกรณ์</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body class="bg-slate-100 font-sans h-screen flex items-center justify-center p-4">

  <!-- Card Login Main -->
  <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200 w-full max-w-md">
    
    <div class="text-center mb-6">
      <div class="inline-block p-3 bg-blue-100 text-blue-600 rounded-full mb-3 text-2xl">
        📦
      </div>
      <h1 class="text-2xl font-bold text-slate-800">เข้าสู่ระบบจัดการอุปกรณ์</h1>
      <p class="text-slate-500 text-xs mt-1">วิชา Database Project - Equipment Borrowing System</p>
    </div>

    <!-- Alert ข้อความแจ้งเตือนเมื่อพิมพ์รหัสผิด -->
    <div id="error-msg" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg text-xs font-medium text-center">
      ❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!
    </div>

    <!-- Form Login -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Username (ชื่อผู้ใช้)</label>
        <input type="text" id="username" required placeholder="กรอก Username" 
               class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Password (รหัสผ่าน)</label>
        <input type="password" id="password" required placeholder="กรอก Password" 
               class="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
      </div>

      <div class="flex justify-between items-center text-xs">
        <label class="flex items-center text-slate-500 cursor-pointer">
          <input type="checkbox" class="mr-1.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500"> บันทึกการเข้าสู่ระบบ
        </label>
        <button type="button" onclick="openForgotModal()" class="text-blue-600 hover:underline font-medium">
          ลืมรหัสผ่าน?
        </button>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
        เข้าสู่ระบบ (Sign In)
      </button>
    </form>
  </div>

  <!-- Modal ยื่นคำร้องอุทธรณ์เมื่อลืมรหัสผ่าน -->
  <div id="forgot-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full space-y-4">
      
      <div class="flex items-center gap-2 border-b pb-3">
        <span class="text-xl">📩</span>
        <div>
          <h3 class="text-base font-bold text-slate-800">ยื่นคำร้องอุทธรณ์ / ขอรีเซ็ตรหัสผ่าน</h3>
          <p class="text-xs text-slate-500">ส่งข้อมูลไปยังทีมผู้พัฒนา (Developer)</p>
        </div>
      </div>
      
      <form onsubmit="submitAppeal(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Username หรือ รหัสนักศึกษา</label>
          <input type="text" id="appeal-user" required placeholder="เช่น Adminsgn01" 
                 class="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">เหตุผลในการยื่นอุทธรณ์</label>
          <textarea id="appeal-reason" required rows="2" placeholder="เช่น ลืมรหัสผ่าน / บัญชีถูกระงับ" 
                    class="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <!-- ข้อความแจ้งเตือนส่งสำเร็จ -->
        <div id="appeal-success" class="hidden p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-lg text-xs font-medium">
          ✅ **ส่งคำร้องสำเร็จ!** ข้อมูลถูกบันทึกไปยัง Developer เรียบร้อยแล้ว
        </div>

        <div class="flex gap-2 pt-2">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium py-2 rounded-lg transition">
            ส่งคำร้อง
          </button>
          <button type="button" onclick="closeForgotModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium py-2 rounded-lg transition">
            ยกเลิก
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // บัญชีเดียวของระบบ (ถ้าอ่านตาราง User ไม่ได้จะใช้ค่านี้แทน)
    const AUTH_USER = "Adminsgn01";
    const AUTH_PASS = "Adminsgnup01";

    async function handleLogin(event) {
      event.preventDefault();
      const userIn = document.getElementById('username').value.trim();
      const passIn = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');

      let ok = userIn === AUTH_USER && passIn === AUTH_PASS;

      // ลองเช็คกับตาราง User ใน database เพิ่มเติม (ค่าคงที่ด้านบนยังใช้ได้เสมอ)
      try {
        const { data, error } = await sb.from('User').select('*').eq('username', userIn).eq('password', passIn);
        if (!error && Array.isArray(data) && data.length > 0) ok = true;
      } catch (e) { }

      if (ok) {
        localStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('adminUser', JSON.stringify({ username: userIn }));
        window.location.href = 'index.html';
      } else {
        errorMsg.classList.remove('hidden');
      }
    }

    // ฟังก์ชัน เปิด-ปิด หน้าต่างยื่นอุทธรณ์
    function openForgotModal() {
      document.getElementById('forgot-modal').classList.remove('hidden');
    }

    function closeForgotModal() {
      document.getElementById('forgot-modal').classList.add('hidden');
      document.getElementById('appeal-success').classList.add('hidden');
      document.getElementById('appeal-user').value = '';
      document.getElementById('appeal-reason').value = '';
    }

    // ฟังก์ชันยื่นคำร้องอุทธรณ์
    function submitAppeal(event) {
      event.preventDefault();
      const user = document.getElementById('appeal-user').value;
      const reason = document.getElementById('appeal-reason').value;

      document.getElementById('appeal-success').classList.remove('hidden');
      
      setTimeout(() => {
        alert(`[ระบบจำลองบันทึกข้อมูล Database]\n\nส่งคำร้องของ Username: "${user}" \nเรื่อง: "${reason}" \nไปยัง Developer เรียบร้อยแล้ว!`);
        closeForgotModal();
      }, 800);
    }
  </script>
</body>
</html>
