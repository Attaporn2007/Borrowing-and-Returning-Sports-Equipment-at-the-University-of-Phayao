<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ผู้ยืม</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    * { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-[#f0f4f8] p-6 text-slate-700">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Top Bar -->
    <div class="flex justify-between items-center">
      <a href="index.html" class="bg-white px-4 py-2 rounded-xl text-xs font-semibold shadow-sm border hover:bg-slate-50 transition flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> ย้อนกลับไปหน้าแรก
      </a>
      <div class="flex items-center gap-3">
        <span class="text-xs font-semibold text-slate-400">โปรไฟล์ผู้ยืม</span>
        <button onclick="logout()" class="px-3 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
        </button>
      </div>
    </div>

    <!-- ส่วนที่ 1: การแสดงโปรไฟล์ / ฟอร์มลงทะเบียนใหม่ -->
    <div id="profile-card" class="bg-white p-6 rounded-2xl shadow-sm border"></div>

    <!-- ส่วนที่ 2: ฟอร์มยืมอุปกรณ์ -->
    <div id="borrow-form-section" class="bg-white p-6 rounded-2xl shadow-sm border hidden">
      <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2 text-emerald-600">
        <i class="fa-solid fa-circle-plus"></i> บันทึกการยืมอุปกรณ์ใหม่
      </h3>
      <form onsubmit="handleBorrow(event)" class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input type="text" list="item-suggestions" id="borrow-item" required placeholder="พิมพ์หรือเลือกอุปกรณ์ เช่น ไม้แบด+ลูกแบด" class="border rounded-lg p-2.5 text-sm outline-none focus:border-blue-500">
        <datalist id="item-suggestions"></datalist>

        <input type="text" id="borrow-qty" value="1" required placeholder="จำนวน เช่น 2+1" class="border rounded-lg p-2.5 text-sm outline-none focus:border-blue-500 text-center">
        
        <button type="submit" class="bg-emerald-600 text-white font-medium p-2.5 rounded-lg text-sm hover:bg-emerald-700 transition flex items-center justify-center gap-1">
          <i class="fa-solid fa-plus"></i> เพิ่มลงในรายการ
        </button>
      </form>
    </div>

    <!-- ส่วนที่ 3: ประวัติการยืม -->
    <div id="history-section" class="bg-white p-6 rounded-2xl shadow-sm border hidden">
      <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2 text-amber-600">
        <i class="fa-solid fa-clock-rotate-left"></i> ประวัติการยืม (เคยยืมวันไหน/อะไร)
      </h3>
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left border">
          <thead class="bg-slate-50 border-b">
            <tr>
              <th class="p-2 border">อุปกรณ์</th>
              <th class="p-2 border text-center">จำนวน</th>
              <th class="p-2 border">เวลายืม</th>
              <th class="p-2 border text-center">สถานะ</th>
            </tr>
          </thead>
          <tbody id="user-history-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'login.html';

    function logout() {
      if (confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('adminUser');
        sessionStorage.removeItem('isLoggedIn');
        window.location.href = 'login.html';
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const searchId = urlParams.get('searchId') || urlParams.get('id');
    const isNew = urlParams.get('isNew') === 'true';
    const type = urlParams.get('type');

    let currentUser = null;
    let itemRemote = false;

    async function init() {
      const students = await fetchStudents();
      currentUser = students.find(u => u.student_id === searchId || u.citizen_id === searchId);

      if (isNew || !currentUser) {
        renderNewUserForm();
      } else {
        await renderUserProfile();
      }
    }

    function renderNewUserForm() {
      const isStudent = type === 'student' || (searchId && searchId.length === 8);
      const studentIdVal = isStudent ? searchId : '';
      const citizenIdVal = !isStudent ? searchId : '';

      document.getElementById('profile-card').innerHTML = `
        <div class="border-b pb-4 mb-4">
          <h2 class="text-lg font-bold text-amber-600 flex items-center gap-2">
            <i class="fa-solid fa-user-plus"></i> ลงทะเบียนข้อมูลผู้ยืมใหม่
          </h2>
          <p class="text-xs text-slate-400 mt-1">กรุณากรอกข้อมูลส่วนตัวเพื่อเข้าใช้งานระบบยืม-คืนอุปกรณ์</p>
        </div>

        <form onsubmit="saveNewUser(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold mb-1">ชื่อ-นามสกุล <span class="text-rose-500">*</span></label>
              <input type="text" id="reg-name" required placeholder="นาย/นางสาว ..." class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">เบอร์โทรศัพท์ <span class="text-rose-500">*</span></label>
              <input type="tel" id="reg-phone" required placeholder="08X-XXX-XXXX" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">รหัสนิสิต (8 หลัก)</label>
              <input type="text" id="reg-student-id" maxlength="8" value="${studentIdVal}" ${isStudent ? 'readonly' : 'required'} class="w-full border rounded-lg p-2.5 text-sm outline-none ${isStudent ? 'bg-slate-100 text-slate-500 font-mono' : 'focus:border-blue-500'}">
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">เลขบัตรประชาชน (13 หลัก)</label>
              <input type="text" id="reg-citizen-id" maxlength="13" value="${citizenIdVal}" ${!isStudent ? 'readonly' : 'required'} class="w-full border rounded-lg p-2.5 text-sm outline-none ${!isStudent ? 'bg-slate-100 text-slate-500 font-mono' : 'focus:border-blue-500'}">
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg text-sm hover:bg-blue-700 transition">
            บันทึกข้อมูลผู้ยืมและดำเนินการต่อ
          </button>
        </form>
      `;
    }

    async function saveNewUser(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const studentId = document.getElementById('reg-student-id').value.trim();
      const citizenId = document.getElementById('reg-citizen-id').value.trim();

      if (studentId.length !== 8 || citizenId.length !== 13) {
        alert('กรุณากรอกรหัสนิสิต (8 หลัก) และ เลขบัตรประชาชน (13 หลัก) ให้ถูกต้อง');
        return;
      }

      // บันทึกลงตาราง student ใน database (ถ้าเขียนไม่ได้จะใช้ localStorage แทน)
      let saved = false;
      try {
        const { error } = await sb.from('student').upsert({
          student_id: studentId,
          citizen_id: citizenId,
          name,
          phone,
          status: 'ปกติ'
        });
        if (!error) saved = true;
      } catch (e) { }

      // เก็บลง localStorage เสมอ (ระบบเดิม/สำรอง)
      const users = localUsers().filter(u => u.studentId !== studentId);
      users.push({ name, phone, studentId, citizenId, status: 'ปกติ' });
      saveLocalUsers(users);
      currentUser = { student_id: studentId, citizen_id: citizenId, name, phone, status: 'ปกติ' };

      alert(saved
        ? 'บันทึกข้อมูลผู้ยืมลงฐานข้อมูล (Supabase) เรียบร้อยแล้ว!'
        : 'บันทึกข้อมูลผู้ยืมเรียบร้อยแล้ว (ยังลงตาราง database ไม่ได้ — ให้รัน SQL สร้างตาราง student ใน Supabase ก่อน แล้วสมัครใหม่)');
      await renderUserProfile();
    }

    async function renderUserProfile() {
      document.getElementById('profile-card').innerHTML = `
        <div class="flex justify-between items-start">
          <div>
            <h2 class="text-xl font-bold text-slate-800">${currentUser.name}</h2>
            <p class="text-xs text-slate-500 mt-1 font-mono">
              รหัสนิสิต: <span class="font-bold text-slate-700">${currentUser.student_id}</span> | 
              เลขบัตร: <span class="font-bold text-slate-700">${currentUser.citizen_id || '-'}</span> | 
              เบอร์โทร: <span class="font-bold text-slate-700">${currentUser.phone || '-'}</span>
            </p>
          </div>
          <span class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold">
            สถานะ${currentUser.status || 'ปกติ'}
          </span>
        </div>
      `;

      document.getElementById('borrow-form-section').classList.remove('hidden');
      document.getElementById('history-section').classList.remove('hidden');
      await loadItemOptions();
      await loadUserHistory();
    }

    // โหลดรายการอุปกรณ์มาเป็น autocomplete สำหรับฟอร์มยืม (พิมพ์เองได้หรือเลือกก็ได้)
    async function loadItemOptions() {
      const { rows, remote } = await fetchRows('item', 'inventory');
      itemRemote = remote;
      const items = toItemRows(rows);

      document.getElementById('item-suggestions').innerHTML = items.map(i =>
        `<option value="${i.itemname}">${i.availablequantity > 0 ? 'เหลือ ' + i.availablequantity : 'ของหมด'}</option>`
      ).join('');
    }

    async function handleBorrow(e) {
      e.preventDefault();
      const itemText = document.getElementById('borrow-item').value.trim();
      const qtyText = document.getElementById('borrow-qty').value.trim() || '1';

      if (!itemText) { alert('กรุณาพิมพ์หรือเลือกอุปกรณ์'); return; }

      const { rows } = await fetchRows('item', 'inventory');
      const items = toItemRows(rows);
      const qty = parseQty(qtyText, 1);

      // พิมพ์ตรงกับชื่อในคลัง 1 ชิ้น / พิมพ์หลายชิ้นคั่นด้วย + เช่น "ไม้แบด+ลูกแบด"
      const matched = items.find(i => (i.itemname || '').trim().toLowerCase() === itemText.toLowerCase());
      const multiNames = matched ? [] : itemText.split('+').map(s => s.trim()).filter(Boolean);
      const multiItems = multiNames.map(name => items.find(i => (i.itemname || '').trim().toLowerCase() === name.toLowerCase()));
      const multiOk = multiNames.length > 0 && multiItems.every(Boolean);

      // โหมด database บันทึกได้เฉพาะชื่อที่ตรงกับคลัง (พิมพ์อิสระใช้ได้เฉพาะระบบเดิม)
      if (itemRemote && !matched && !multiOk) {
        alert('ไม่พบอุปกรณ์ในคลัง — พิมพ์ชื่อให้ตรงกับรายการ หรือพิมพ์หลายชิ้นคั่นด้วย + เช่น ไม้แบด+ลูกแบด');
        return;
      }

      if (matched && qty > matched.availablequantity) {
        alert(`จำนวนยืมเกินคงเหลือ (${matched.itemname} เหลือ ${matched.availablequantity} ชิ้น)`);
        return;
      }

      let qtyParts = null;
      if (multiOk) {
        qtyParts = qtyText.split('+').map(s => parseInt(s.trim(), 10));
        if (qtyParts.length !== multiItems.length || qtyParts.some(n => isNaN(n) || n < 1)) {
          alert(`จำนวนต้องใส่เท่ากับจำนวนชิ้น เช่น พิมพ์ "${multiNames.join('+')}" แล้วจำนวนใส่ "${multiNames.map(() => 1).join('+')}"`);
          return;
        }
        const badIdx = multiItems.findIndex((it, idx) => qtyParts[idx] > it.availablequantity);
        if (badIdx > -1) {
          alert(`จำนวนยืมเกินคงเหลือ (${multiItems[badIdx].itemname} เหลือ ${multiItems[badIdx].availablequantity} ชิ้น)`);
          return;
        }
      }

      if (!itemRemote) {
        // ระบบเดิม: เก็บข้อความตามที่พิมพ์ลง localStorage (หักสต็อกทีละชิ้นเมื่อตรงรายการ)
        const inv = localInventory();
        if (matched) {
          const target = inv.find(i => i.id === matched.item_id);
          if (target) target.qty = (Number(target.qty) || 0) - qty;
        } else if (qtyParts) {
          multiItems.forEach((it, idx) => {
            const target = inv.find(i => i.id === it.item_id);
            if (target) target.qty = (Number(target.qty) || 0) - qtyParts[idx];
          });
        }
        saveLocalInventory(inv);
        const now = new Date();
        const borrows = localBorrows();
        borrows.push({
          id: Date.now(),
          studentId: currentUser.student_id,
          citizenId: currentUser.citizen_id,
          name: currentUser.name,
          item: itemText,
          qty: qtyText,
          borrowTime: `${now.getHours()}.${now.getMinutes().toString().padStart(2, '0')}`,
          status: 'กำลังยืม'
        });
        saveLocalBorrows(borrows);
        alert('บันทึกรายการยืมสำเร็จ!');
        window.location.href = 'borrow-table.html';
        return;
      }

      // โหมด database
      let userId = null;
      const { data: adminRows } = await sb.from('User').select('user_id').limit(1);
      if (adminRows && adminRows.length) userId = adminRows[0].user_id;
      const admin = currentAdmin();
      if (admin && admin.user_id) userId = admin.user_id;

      const { data: borrow, error: bErr } = await sb.from('borrow').insert([{
        borrowdatetime: nowISO(),
        student_id: currentUser.student_id,
        national_id: currentUser.citizen_id || null,
        borrowname: currentUser.name,
        status: 'กำลังยืม',
        duetime: dueISO(),
        user_id: userId
      }]).select().single();

      if (bErr) { alert('บันทึกการยืมไม่สำเร็จ: ' + bErr.message); return; }

      const lines = matched
        ? [{ item_id: matched.item_id, quantity: qty }]
        : multiItems.map((it, idx) => ({ item_id: it.item_id, quantity: qtyParts[idx] }));

      for (const line of lines) {
        const { error: biErr } = await sb.from('borrowitem').insert([{
          quantity: line.quantity,
          status: 'กำลังยืม',
          borrow_id: borrow.borrow_id,
          item_id: line.item_id
        }]);
        if (biErr) { alert('บันทึกรายการอุปกรณ์ไม่สำเร็จ: ' + biErr.message); return; }
      }

      for (const it of (matched ? [matched] : multiItems)) {
        const line = lines.find(l => l.item_id === it.item_id);
        await sb.from('item').update({ availablequantity: it.availablequantity - line.quantity }).eq('item_id', it.item_id);
      }

      alert('บันทึกรายการยืมสำเร็จ!');
      window.location.href = 'borrow-table.html';
    }

    async function loadUserHistory() {
      const bundle = await getBorrowBundle();
      const itemMap = {};
      (bundle.items || []).forEach(i => itemMap[i.item_id] = i);

      const rows = [];
      (bundle.borrows || [])
        .filter(b => b.student_id === currentUser.student_id)
        .forEach(b => {
          const lines = (bundle.borrowitems || []).filter(x => x.borrow_id === b.borrow_id);
          const names = lines.map(x => `${itemMap[x.item_id] ? itemMap[x.item_id].itemname : (x.itemname || 'อุปกรณ์ #' + x.item_id)} (${x.quantity})`).join(', ');
          // ถ้าพิมพ์จำนวนแบบมีสูตร เช่น "2+1" ให้แสดงตามที่พิมพ์ ไม่แปลงเป็นผลรวม
          const qty = (b.qty !== undefined && b.qty !== null && isNaN(Number(b.qty))) ? b.qty
            : lines.reduce((s, x) => s + Number(x.quantity || 0), 0);
          rows.push({ ...b, item: names || '-', qty });
        });

      document.getElementById('user-history-body').innerHTML = rows.map(b => `
        <tr class="border-b">
          <td class="p-2 border font-medium">${b.item}</td>
          <td class="p-2 border text-center font-bold">${b.qty}</td>
          <td class="p-2 border font-mono text-slate-500">${fmtDT(b.borrowdatetime)}</td>
          <td class="p-2 border text-center">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${b.status === 'คืนแล้ว' ? 'bg-emerald-100 text-emerald-600' : (b.status === 'Blacklist' || b.status === 'เกินกำหนด') ? 'bg-rose-100 text-rose-600' : 'bg-amber-100 text-amber-700'}">${b.status}</span>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="p-4 text-center text-slate-400">ยังไม่มีประวัติการยืม</td></tr>';
    }

    init();
  </script>
</body>
</html>
