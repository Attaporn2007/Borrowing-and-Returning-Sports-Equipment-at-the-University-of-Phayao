<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าหลัก - ค้นหานิสิต</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    * { font-family: 'Kanit', sans-serif; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f0f4f8] p-6 text-slate-700">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header Navigation -->
    <header class="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl">📦</span>
        <div>
          <h1 class="text-xl font-bold text-blue-600">ระบบยืม-คืนอุปกรณ์</h1>
          <p class="text-xs text-slate-400">Database Project</p>
        </div>
      </div>
      
      <nav class="flex items-center gap-2 text-sm font-medium whitespace-nowrap">
        <a href="index.html" class="px-3 py-2 bg-blue-50 text-blue-600 rounded-lg">ค้นหา</a>
        <a href="borrow-table.html" class="px-3 py-2 hover:bg-slate-100 rounded-lg">ตารางยืม-คืน</a>
        <a href="dashboard.html" class="px-3 py-2 hover:bg-slate-100 rounded-lg">คลังอุปกรณ์</a>
        <a href="status.html" class="px-3 py-2 hover:bg-slate-100 rounded-lg">สถานะ/Blacklist</a>
        <a href="history.html" class="px-3 py-2 hover:bg-slate-100 rounded-lg">ประวัติรายวัน</a>
        
        <button onclick="logout()" class="ml-2 px-3 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
        </button>
      </nav>
    </header>

    <!-- Search Box -->
    <main class="bg-white p-6 rounded-2xl shadow-sm border">
      <h2 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-magnifying-glass text-blue-500"></i> ค้นหานิสิตในฐานข้อมูล
      </h2>
      <div class="flex gap-3">
        <input type="text" id="search-input" maxlength="13" placeholder="พิมพ์รหัสนิสิต (8 หลัก) หรือ เลขบัตรประชาชน (13 หลัก)" class="flex-1 border rounded-lg px-4 py-2.5 text-sm outline-none focus:border-blue-500">
        <button onclick="search()" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition">ค้นหา</button>
      </div>
      <p class="text-xs text-slate-400 mt-3">💡 ตัวอย่างรหัสทดสอบ: <span class="bg-slate-100 px-2 py-0.5 rounded cursor-pointer font-mono" onclick="document.getElementById('search-input').value='68023606'">68023606</span> (8 หลัก) หรือ <span class="bg-slate-100 px-2 py-0.5 rounded cursor-pointer font-mono" onclick="document.getElementById('search-input').value='1100100200300'">1100100200300</span> (13 หลัก)</p>
      
      <div id="result" class="mt-6 border-t pt-4 hidden"></div>
    </main>

  </div>

  <script>
    // 1. เช็คสิทธิ์ล็อกอิน
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      alert('กรุณาเข้าสู่ระบบก่อนใช้งาน');
      window.location.href = 'login.html';
    }

    function logout() {
      if (confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('adminUser');
        sessionStorage.removeItem('isLoggedIn');
        window.location.href = 'login.html';
      }
    }

    // 2. ฟังก์ชันค้นหาพร้อม Validation
    function search() {
      const val = document.getElementById('search-input').value.trim();
      const isNumeric = /^\d+$/.test(val);

      // ตรวจสอบ: ต้องเป็นตัวเลขล้วน และ ยาว 8 หรือ 13 หลักเท่านั้น
      if (!isNumeric || (val.length !== 8 && val.length !== 13)) {
        alert('กรุณากรอกข้อมูลให้ถูกต้อง');
        return;
      }

      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const foundUser = users.find(u => u.studentId === val || u.citizenId === val);
      const res = document.getElementById('result');
      res.classList.remove('hidden');

      if (foundUser) {
        // พบนิสิตในระบบ
        res.innerHTML = `
          <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 flex justify-between items-center">
            <div>
              <p class="font-bold text-blue-900">พบนิสิต: ${foundUser.name} (${val})</p>
              <p class="text-xs text-blue-600">กดเพื่อดูโปรไฟล์ ประวัติการยืม และทำรายการยืม</p>
            </div>
            <a href="profile.html?id=${val}" class="bg-blue-600 text-white text-xs px-4 py-2 rounded-lg hover:bg-blue-700 font-medium transition">เข้าสู่โปรไฟล์ผู้ยืม</a>
          </div>`;
      } else {
        // ไม่พบข้อมูลในระบบ -> แจ้งกรอกข้อมูลเพิ่ม
        const isStudentId = val.length === 8;
        const typeText = isStudentId ? 'รหัสนิสิต 8 หลัก' : 'เลขบัตรประชาชน 13 หลัก';
        
        res.innerHTML = `
          <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 flex justify-between items-center">
            <div>
              <p class="font-bold text-amber-900">ไม่พบข้อมูลในระบบ (${typeText}: ${val})</p>
              <p class="text-xs text-amber-700">ระบุข้อมูลเพิ่มเติม (ชื่อ, เบอร์โทร, ${isStudentId ? 'เลขบัตรประชาชน' : 'รหัสนิสิต'}) เพื่อเข้าสู่โปรไฟล์</p>
            </div>
            <a href="profile.html?searchId=${val}&type=${isStudentId ? 'student' : 'citizen'}&isNew=true" class="bg-amber-600 text-white text-xs px-4 py-2 rounded-lg hover:bg-amber-700 font-medium transition">เพิ่มข้อมูลผู้ยืม</a>
          </div>`;
      }
    }
  </script>
</body>
</html>
